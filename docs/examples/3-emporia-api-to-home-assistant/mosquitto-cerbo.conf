# Load this file on the MQTT broker used by Home Assistant.
# Replace CERBO_IP and PORTAL_ID before use.
# Reuse an existing Cerbo bridge instead of creating a second connection.
connection cerbo-emporia
address CERBO_IP:1883
remote_clientid ha-emporia-bridge
bridge_protocol_version mqttv311
try_private false
cleansession true
start_type automatic
notifications false

# Cerbo notifications become victron/N/... on the Home Assistant broker.
topic N/PORTAL_ID/# in 0 victron/

# Home Assistant requests lose the victron/ prefix on their way to Cerbo.
topic R/PORTAL_ID/# out 0 victron/
