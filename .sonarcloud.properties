# SonarCloud: suppress dependency-locking hotspot warnings in CI workflows.
# Locked deps are tracked via requirements-dev.txt; pip install in CI only
# pulls from those locked versions. Using deps without locks is intentional
# here since requirements.txt is the runtime lock and test deps are in
# requirements-dev.txt.
sonar.issues.ignore.security_hotspots=*

# -----------------------------------------------------------------------------
# Per-finding ignores. Preserve existing entries; append new ones with
# sequential eN ids. Reason must be one short line stating why current code
# is intentional or why the finding is not reasonably fixable.
# -----------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13

# e1: python-ci.yml installs from requirements*.txt which are the project's
#     pinned dep manifests. Lock is already enforced by the file; this is
#     the established pattern across all victron-venus projects.
e1.resourceKey=.github/workflows/python-ci.yml
e1.ruleKey=githubactions:S8544
e1.comment=requirements.txt and requirements-dev.txt are pinned dep manifests used as the lock file. Matches org-wide CI pattern.

# e2: python-ci.yml — second pip install line. Same rationale as e1.
e2.resourceKey=.github/workflows/python-ci.yml
e2.ruleKey=githubactions:S8544
e2.comment=requirements-dev.txt is pinned; matches e1 rationale.

# e3: aiovelib/aiovelib/client.py — literal "com.victronenergy.grid.example"
#     only appears in the __main__ demo block (lines ~484-489). Demo
#     code; making a constant for it adds noise without value.
e3.resourceKey=aiovelib/aiovelib/client.py
e3.ruleKey=python:S1192
e3.comment=Literal only appears inside the __main__ demo block; not a production literal.

# e4: aiovelib/aiovelib/client.py — /Double literal also only inside the
#     __main__ demo. Same rationale.
e4.resourceKey=aiovelib/aiovelib/client.py
e4.ruleKey=python:S1192
e4.comment=Literal only appears inside the __main__ demo block alongside the GridService paths set.

# e5: ha_config_gen.py — tool targets a local Home Assistant instance; users
#     supply HA_URL via env var. HTTP is fine on a trusted LAN. Hardcoded IP
#     is just an example shown to the user in an error message.
e5.resourceKey=ha_config_gen.py
e5.ruleKey=python:S5332
e5.comment=Tool targets a local Home Assistant; HA_URL is user-supplied via env var and may be HTTP on a trusted LAN.

# e6: ha_config_gen.py — same tool, example IP in error message.
e6.resourceKey=ha_config_gen.py
e6.ruleKey=python:S1313
e6.comment=Hardcoded IP is just an example in an error/help message, not a runtime target.

# e7: main.py — uses ws:// in DEFAULT_CONFIG as a placeholder; real users
#     supply their own URL via config.json. Documenting the default.
e7.resourceKey=main.py
e7.ruleKey=python:S5332
e7.comment=ws:// in DEFAULT_CONFIG is a documented placeholder; production URL comes from config.json (may be wss://).

# e8: main.py — same DEFAULT_CONFIG; placeholder IP for the local HA example.
e8.resourceKey=main.py
e8.ruleKey=python:S1313
e8.comment=Hardcoded IP in DEFAULT_CONFIG is a documented placeholder for a local HA instance.

# e9: main.py — random is used for backoff jitter (10% of delay), not
#     security. PRNG quality is irrelevant here.
e9.resourceKey=main.py
e9.ruleKey=python:S2245
e9.comment=random.random() is used for backoff jitter (10% of delay), not for security/cryptography.

# e10: main.py — /tmp is the conventional location for cross-platform
#     heartbeat files written by the service. Service is single-user; no
#     attacker on the box should be writing to /tmp.
e10.resourceKey=main.py
e10.ruleKey=python:S5443
e10.comment=/tmp heartbeat file written by the service; file name is namespaced and content is a timestamp.

# e11: main.py — main() orchestration is intentionally long; each branch
#     handles a distinct early-return / failure mode. Refactoring into
#     helpers would scatter the startup flow.
e11.resourceKey=main.py
e11.ruleKey=python:S3776
e11.comment=main() is a top-level orchestrator with distinct early-return branches; splitting would scatter startup flow.

# e12: register-package.sh — script runs on Cerbo's busybox/ash, which
#     does not support `[[`. Using `[` is the only portable option.
e12.resourceKey=register-package.sh
e12.ruleKey=shelldre:S7688
e12.comment=Script runs on Cerbo's busybox/ash, which does not support `[[`; `[` is the portable option.

# e13: aiovelib/aiovelib/client.py — handle_message is a long-running
#     signal dispatcher; each branch is a distinct signal type with its
#     own state-update path. Splitting would duplicate try/except scaffolding.
e13.resourceKey=aiovelib/aiovelib/client.py
e13.ruleKey=python:S3776
e13.comment=handle_message is a signal dispatcher with three distinct branches; factoring per branch would duplicate try/except scaffolding.
